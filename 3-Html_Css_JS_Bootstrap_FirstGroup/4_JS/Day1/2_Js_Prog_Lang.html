   <div>
    <h2> ENg . Fatimah Answer</h2>

    <h2>3 Marks</h2>

    <label>Mark 1:</label>
    <input type="number" id="mark1"><br><br>

    <label>Mark 2:</label>
    <input type="number" id="mark2"><br><br>

    <label>Mark 3:</label>
    <input type="number" id="mark3"><br><br>

    <button onclick="calculate()">Calculate</button>

    <p id="avg"></p>
    <p id="max"></p>
    <p id="min"></p>

    <script>
        function calculate() {

            let mark1 = Number(document.getElementById("mark1").value);
            let mark2 = Number(document.getElementById("mark2").value);
            let mark3 = Number(document.getElementById("mark3").value);

            let average = (mark1 + mark2 + mark3) / 3;
            let maximum = Math.max(mark1, mark2, mark3);
            let minimum = Math.min(mark1, mark2, mark3);

            document.getElementById("avg").innerHTML = "Average = " + average;
            document.getElementById("max").innerHTML = "Max = " + maximum;
            document.getElementById("min").innerHTML = "Min = " + minimum;
        }
    </script>

</div>

<div>
    <h2>Check the Day</h2>

    <input type="text" id="day" placeholder="Enter a day">

    <button onclick="checkDay()">Check</button>

    <p id="result"></p>

    <script>
        function checkDay() {

            let day = document.getElementById("day").value.toLowerCase();

            if (day == "friday" || day == "saturday") {
                document.getElementById("result").innerHTML = "Weekend";
            }
            else if (day == "sunday" || day == "monday" || 
                     day == "tuesday" || day == "wednesday" || 
                     day == "thursday") {
                document.getElementById("result").innerHTML = "Work Day";
            }
            else {
                document.getElementById("result").innerHTML = "Invalid Day";
            }
        }
    </script>
</div>
